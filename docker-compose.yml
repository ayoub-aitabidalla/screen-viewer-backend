services:
  postgres:
    image: postgres:16-alpine
    container_name: screenviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-screenviewer}
      POSTGRES_USER: ${DB_USER:-screenviewer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-screenviewer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
